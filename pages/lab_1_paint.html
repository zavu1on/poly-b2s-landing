<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/index.css">
  <link rel="stylesheet" href="../styles/pic.css">
  <title>Лабораторная работа №1. Рисунок CSS</title>
</head>
<body>
  <header class="header">
    <a class="header__logo" href="../index.html" aria-label="Branch to Start - на главную">B2S</a>

    <input type="checkbox" class="header__burger-toggle" id="burger-toggle">
    <label class="header__burger" for="burger-toggle">
      <span></span><span></span><span></span>
    </label>

    <nav class="header__nav">
      <ul class="header__nav-list">
        <li class="header__nav-item"><a class="header__nav-link" href="../index.html">На главную</a></li>
        <li class="header__nav-item"><a class="header__nav-link" href="../index.html#labs">К лабораторным</a></li>
      </ul>
    </nav>
  </header>

  <main class="lab-main">
  <div class="lab-content">
  <div class="pic">

    <div class="pic__branch-container">
      <div class="pic__branch"></div>
      <div class="pic__leaf pic__leaf-1"></div>
      <div class="pic__leaf pic__leaf-2"></div>
      <div class="pic__leaf pic__leaf-3"></div>
    </div>

    <div class="pic__dino">
      <div class="pic__dino-tail"></div>
      <div class="pic__dino-neck"></div>
      <div class="pic__dino-leg pic__dino-leg--back"></div>
      <div class="pic__dino-foot pic__dino-foot--back"></div>
      <div class="pic__dino-body"></div>
      <div class="pic__dino-head">
        <div class="pic__dino-horn pic__dino-horn--left"></div>
        <div class="pic__dino-horn pic__dino-horn--right"></div>
        <div class="pic__dino-eye pic__dino-eye--left"></div>
        <div class="pic__dino-eye pic__dino-eye--right"></div>
        <div class="pic__dino-nostril pic__dino-nostril--left"></div>
        <div class="pic__dino-nostril pic__dino-nostril--right"></div>
        <div class="pic__dino-tooth pic__dino-tooth--1"></div>
        <div class="pic__dino-tooth pic__dino-tooth--2"></div>
        <div class="pic__dino-tooth pic__dino-tooth--3"></div>
        <div class="pic__dino-tooth pic__dino-tooth--4"></div>
      </div>
      <div class="pic__dino-leg pic__dino-leg--front"></div>
      <div class="pic__dino-foot pic__dino-foot--front"></div>
      <div class="pic__dino-arm pic__dino-arm--back"></div>
      <div class="pic__dino-forearm pic__dino-forearm--back"></div>
      <div class="pic__dino-arm pic__dino-arm--front"></div>
      <div class="pic__dino-forearm pic__dino-forearm--front"></div>
    </div>

    <div class="pic__grass-container">
      <div class="pic__grass pic__grass-1"></div>
      <div class="pic__grass pic__grass-2"></div>
      <div class="pic__grass pic__grass-3"></div>
    </div>

    <div class="pic__ground"></div>
  </div>
  <div class="source-container">
    <img src="../assets/pain.png" alt="динозавр">
  </div>
  </div>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <span class="footer__logo">B2S</span>
      <p class="footer__text">Branch to Start - учебный проект, СПбПУ</p>
    </div>
    <div class="footer__contacts">
      <a href="../index.html">На главную</a>
    </div>
  </footer>
</body>
</html>
